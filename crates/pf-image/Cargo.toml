[package]
name = "pf-image"
description = "Datos de imagen de PhotoForge: RGB lineal en coma flotante, carga, metadatos, histograma y exportación"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pf-core = { workspace = true }
image = { workspace = true }
kamadak-exif = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# rawler es la biblioteca con la que PhotoForge leerá RAW. Está aquí como
# dependencia de DESARROLLO y no de producción a propósito: el ejemplo
# `sonda-raw` la usa para documentar con números lo que hace y lo que no, pero
# la aplicación todavía no abre RAW, y una dependencia que no se usa son 80
# cajas más que compilar y una licencia LGPL que explicar sin ganar nada.
# El día que PhotoForge abra RAW de verdad, esta línea sube a [dependencies].
rawler = "0.8.0"
