[package]
name = "pf-image"
description = "Datos de imagen de PhotoForge: RGB lineal en coma flotante, carga, metadatos, histograma y exportación"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pf-core = { workspace = true }
# La decodificación de RAW. Es el motor de DNGLab: Rust puro, sin FFI y sin
# compilar nada en C, que era la condición para que esto funcionara en Windows
# con MSVC sin pelearse. Licencia LGPL-2.1; el README explica qué implica.
rawler = "0.8.0"
image = { workspace = true }
kamadak-exif = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
